# Standalone private deployment: do not combine with the local ComfyUI override.
name: drama-plus-private
services:
  app:
    image: ${DRAMA_IMAGE:?Set DRAMA_IMAGE in .env}
    ports:
      - "127.0.0.1:5679:5679"
    environment:
      NODE_ENV: production
      HUOBAO_LOCAL_RUNTIME_ENABLED: "false"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
